<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>समाचार — 90I न्यूज़</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .site-logo-main { max-height: 75px; width: auto; object-fit: contain; margin: 0 auto; display: block; }
    .share-suite { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
    .share-btn { padding: 8px 14px; border-radius: 4px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; cursor: pointer; border: none; }
    .btn-wa { background: #25D366; }
    .btn-fb { background: #1877F2; }
    .btn-tw { background: #000000; }
    .btn-insta { background: #E1306C; }
    .btn-tg { background: #0088cc; }
    .btn-copy { background: #555555; }
  </style>
</head>
<body>
  <div class="reading-progress" id="progressBar"></div>

  <header class="main-header" style="background: #fff; border-bottom: 1px solid #ddd; padding: 12px 0;">
    <div class="container" style="text-align: center;">
      <a href="index.html">
        <img src="assets/logo.png" alt="90I न्यूज़" class="site-logo-main">
      </a>
    </div>
  </header>

  <main class="container" style="max-width: 860px; margin-top: 25px; margin-bottom: 60px;">
    <article id="articleContainer">
      <p>समाचार लोड हो रहा है...</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 90I न्यूज़. सर्वाधिकार सुरक्षित। | <a href="index.html" style="color: #fff;">होम पेज पर जाएं</a>
      </div>
    </div>
  </footer>

  <script src="assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const data = await loadData();
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      const article = (data && data.news) ? (data.news.find(n => n.slug === slug) || data.news[0]) : null;

      if (!article) {
        document.getElementById('articleContainer').innerHTML = `
          <h2>यह लेख उपलब्ध नहीं है।</h2>
          <p><a href="index.html">होम पेज पर वापस जाएं</a></p>
        `;
        return;
      }

      document.title = `${article.seoTitle || article.title} — 90I न्यूज़`;
      const currentUrl = window.location.href;

      document.getElementById('articleContainer').innerHTML = `
        <div class="article-header">
          <span class="badge-category">${article.category}</span>
          <h1 style="margin: 12px 0; font-size: 28px; line-height: 1.3;">${article.title}</h1>
          <div class="news-meta">
            प्रकाशित: ${formatDateHindi(article.date)} ${article.time ? '| ' + article.time : ''} | लेखक: ${article.author}
          </div>
        </div>

        <div class="share-suite">
          <a class="share-btn btn-wa" href="https://api.whatsapp.com/send?text=${encodeURIComponent(article.title + ' ' + currentUrl)}" target="_blank">WhatsApp</a>
          <a class="share-btn btn-fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(currentUrl)}" target="_blank">Facebook</a>
          <a class="share-btn btn-tw" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(article.title)}&url=${encodeURIComponent(currentUrl)}" target="_blank">Twitter (X)</a>
          <a class="share-btn btn-insta" href="https://instagram.com/" target="_blank">Instagram</a>
          <a class="share-btn btn-tg" href="https://t.me/share/url?url=${encodeURIComponent(currentUrl)}&text=${encodeURIComponent(article.title)}" target="_blank">Telegram</a>
          <button class="share-btn btn-copy" onclick="copyArticleLink()">🔗 लिंक कॉपी</button>
        </div>

        <img src="${article.image}" alt="${article.title}" style="width: 100%; max-height: 480px; object-fit: cover; margin: 15px 0;">
        ${article.imageCaption ? `<p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: -8px; margin-bottom: 15px;">${article.imageCaption}</p>` : ''}
        
        <div class="article-body" style="font-size: 18px; line-height: 1.8; color: #222;">
          ${sanitizeHtml(article.content)}
        </div>
      `;

      window.addEventListener('scroll', () => {
        const total = document.documentElement.scrollHeight - window.innerHeight;
        const progress = (window.scrollY / total) * 100;
        document.getElementById('progressBar').style.width = `${progress}%`;
      });
    });

    function copyArticleLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("आर्टिकल लिंक कॉपी हो गया!");
    }
  </script>
</body>
</html>
