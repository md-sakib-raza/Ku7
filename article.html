<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article | 90i News</title>
  <style>
    :root {
      --bg:#f5f5f7;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --brand:#dc2626;
      --line:#e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: "Noto Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .wrap {
      width:min(800px, 94%);
      margin:28px auto 40px;
    }
    .article-card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      padding:20px;
    }
    .badge {
      display:inline-block;
      background:#fee2e2;
      color:#991b1b;
      border:1px solid #fecaca;
      border-radius:999px;
      font-size:.78rem;
      padding:4px 10px;
      margin-bottom:10px;
    }
    h1 {
      margin:0 0 10px;
      line-height:1.25;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
    }
    .meta {
      color:var(--muted);
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      padding:10px 0;
      font-size:.93rem;
      margin-bottom:14px;
    }
    .summary-box {
      background:#fff7f7;
      border-left:4px solid var(--brand);
      padding:12px 14px;
      border-radius:8px;
      margin:12px 0 16px;
      line-height:1.6;
      color:#374151;
    }
    figure {
      margin:0 0 18px;
    }
    figure img {
      width:100%;
      border-radius:10px;
      border:1px solid var(--line);
      object-fit:cover;
    }
    figcaption {
      margin-top:8px;
      color:var(--muted);
      font-size:.88rem;
    }
    #bodyContent {
      line-height:1.82;
      font-size:1.03rem;
      color:#1f2937;
    }
    #bodyContent p { margin: 0 0 1rem; }

    .share {
      margin-top:26px;
      border-top:1px solid var(--line);
      padding-top:16px;
    }
    .share h3 { margin:0 0 10px; }
    .share-buttons {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .share-buttons button, .share-buttons a {
      border:0;
      border-radius:8px;
      padding:9px 12px;
      text-decoration:none;
      color:white;
      font-size:.92rem;
      cursor:pointer;
      display:inline-block;
    }
    .wa{ background:#16a34a; }
    .fb{ background:#1877f2; }
    .tw{ background:#111827; }
    .native{ background:#ea580c; }
    .copy{ background:#4b5563; }

    .state {
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:18px;
      text-align:center;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <article id="articleRoot" class="article-card" style="display:none;">
      <span id="categoryBadge" class="badge"></span>
      <h1 id="headline"></h1>
      <div id="metaBar" class="meta"></div>
      <div id="summaryBox" class="summary-box"></div>
      <figure id="figureWrap" style="display:none;">
        <img id="featuredImage" src="" alt="Featured image" />
        <figcaption id="imageCaption"></figcaption>
      </figure>
      <section id="bodyContent"></section>

      <!-- SHARE SUITE ONLY AT BOTTOM -->
      <section class="share">
        <h3>Share this article</h3>
        <div class="share-buttons">
          <a id="waShare" class="wa" target="_blank" rel="noopener">WhatsApp</a>
          <a id="fbShare" class="fb" target="_blank" rel="noopener">Facebook</a>
          <a id="twShare" class="tw" target="_blank" rel="noopener">Twitter</a>
          <button id="nativeShareBtn" class="native">Share</button>
          <button id="copyLinkBtn" class="copy">Copy Link</button>
        </div>
      </section>
    </article>

    <div id="stateBox" class="state">Loading article...</div>
  </main>

  <script>
    "use strict";

    const DATA_PATH = "data/90i-data.json";

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      const state = document.getElementById("stateBox");
      try {
        const params = new URLSearchParams(window.location.search);
        const slugParam = (params.get("slug") || "").trim().toLowerCase();
        const idParam = (params.get("id") || "").trim();

        if (!slugParam && !idParam) {
          state.textContent = "No article parameter provided. Use ?slug=... or ?id=...";
          return;
        }

        const res = await fetch(DATA_PATH, { cache: "no-store" });
        if (!res.ok) throw new Error("Unable to load data source.");
        const json = await res.json();

        const news = Array.isArray(json?.news) ? json.news : [];
        let article = null;

        if (slugParam) {
          article = news.find(n => String(n?.slug || "").trim().toLowerCase() === slugParam) || null;
        }
        if (!article && idParam) {
          article = news.find(n => String(n?.id || "").trim() === idParam) || null;
        }

        if (!article) {
          state.textContent = "Article not found.";
          return;
        }

        renderArticle(article);
        state.style.display = "none";
        document.getElementById("articleRoot").style.display = "block";
      } catch (err) {
        state.textContent = "Failed to load article: " + (err?.message || "Unknown error");
      }
    }

    function renderArticle(a) {
      const title = safeText(a?.title || "Untitled");
      const category = safeText(a?.category || "General");
      const author = safeText(a?.author || "Desk Reporter");
      const published = safeText(a?.publishedAt || "");
      const summary = safeText(a?.summary || "");
      const body = String(a?.bodyHtml || "<p>No content available.</p>");
      const image = String(a?.image || "").trim();
      const caption = safeText(a?.imageCaption || "");

      document.title = title + " | 90i News";
      document.getElementById("categoryBadge").textContent = category;
      document.getElementById("headline").textContent = title;
      document.getElementById("metaBar").textContent = `By ${author} • ${published}`;
      document.getElementById("summaryBox").textContent = summary;
      document.getElementById("bodyContent").innerHTML = body;

      const fig = document.getElementById("figureWrap");
      if (image) {
        document.getElementById("featuredImage").src = image;
        document.getElementById("imageCaption").textContent = caption;
        fig.style.display = "block";
      } else {
        fig.style.display = "none";
      }

      setupShare(title);
    }

    function setupShare(title) {
      const url = window.location.href;
      const text = `${title}`;

      document.getElementById("waShare").href =
        `https://wa.me/?text=${encodeURIComponent(text + " " + url)}`;
      document.getElementById("fbShare").href =
        `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
      document.getElementById("twShare").href =
        `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;

      document.getElementById("nativeShareBtn").addEventListener("click", async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: document.title, text, url });
          } catch (_) {}
        } else {
          alert("Native sharing is not supported on this browser.");
        }
      });

      document.getElementById("copyLinkBtn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(url);
          alert("Link copied.");
        } catch (_) {
          // fallback
          const tmp = document.createElement("input");
          tmp.value = url;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand("copy");
          document.body.removeChild(tmp);
          alert("Link copied.");
        }
      });
    }

    function safeText(v) {
      return String(v);
    }
  </script>
</body>
</html>
