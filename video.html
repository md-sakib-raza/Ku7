<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>वीडियो — THE 90I NEWS</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="main-header">
    <div class="container site-branding">
      <h1 class="site-title"><a href="index.html">THE 90I NEWS</a></h1>
    </div>
  </header>
  <main class="container" style="margin-top: 30px;">
    <h2 class="section-title">वीडियो समाचार</h2>
    <div class="grid-2col" id="videoGrid"></div>
  </main>
  <script src="assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const data = await loadData();
      const grid = document.getElementById('videoGrid');
      if (data && data.videos.length > 0) {
        grid.innerHTML = data.videos.map(v => {
          const videoId = v.youtube.includes('v=') ? v.youtube.split('v=')[1].split('&')[0] : v.youtube;
          return `
            <div class="news-card-sm">
              <iframe width="100%" height="220" src="https://www.youtube-nocookie.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
              <h3 style="margin-top: 8px;">${v.title}</h3>
            </div>
          `;
        }).join('');
      }
    });
  </script>
</body>
</html>
