<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>90I Shorts | 60 शब्दों में ताज़ा खबरें • THE 90I NEWS</title>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9762787230045511" crossorigin="anonymous"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yantramanav:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #dc2626;
      --brand-dark: #b91c1c;
      --brand-soft: rgba(220, 38, 38, 0.15);
      --bg-dark: #090d16;
      --card-bg: #0f172a;
      --card-inner: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --line: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Yantramanav', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Navigation Header Matching THE 90I NEWS */
    .shorts-header {
      background: #090d16;
      border-bottom: 2px solid var(--brand);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .logo-box {
      text-decoration: none;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .logo-text {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      font-family: 'Rozha One', serif;
      line-height: 1;
    }
    .logo-text span { color: var(--brand); }
    .shorts-badge {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nav-actions a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      background: #1e293b;
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: 6px;
      transition: 0.2s;
    }
    .nav-actions a:hover {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    /* Reading Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 3px;
      background: #1e293b;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #dc2626, #f59e0b, #22c55e);
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.8);
    }

    /* Main Fullscreen Deck Area */
    .deck-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      perspective: 1000px;
    }

    /* Single News Card */
    .short-card-wrapper {
      width: 100%;
      max-width: 460px;
      height: 100%;
      max-height: 680px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(220, 38, 38, 0.08);
      touch-action: pan-y;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease;
    }
    .short-card-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3.5px;
      background: linear-gradient(90deg, #dc2626, #ef4444);
      z-index: 10;
    }

    /* Media Area */
    .card-media-box {
      width: 100%;
      height: 42%;
      position: relative;
      background: #000000;
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-media-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .card-media-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(15,23,42,0.85) 100%);
    }
    .badge-category {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--brand);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 4px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 5;
    }
    .badge-rating {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      color: #f59e0b;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      backdrop-filter: blur(4px);
      z-index: 5;
    }

    /* Card Content Area */
    .card-body-box {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      overflow-y: auto;
      background: var(--card-bg);
    }
    .headline-text {
      font-size: 19px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .meta-row span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .summary-60words {
      font-size: 14.5px;
      line-height: 1.7;
      color: #cbd5e1;
      font-weight: 500;
      word-break: break-word;
    }

    /* Card Bottom Action Bar */
    .card-footer-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      margin-top: auto;
      background: var(--card-bg);
    }
    .btn-read-full {
      color: #ffffff;
      background: var(--brand);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-read-full:hover {
      background: var(--brand-dark);
    }
    .btn-share {
      background: #1e293b;
      border: 1px solid var(--line);
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-share:hover {
      background: #334155;
      color: #ffffff;
      border-color: var(--brand);
    }

    /* Interactive Side Arrow Controls (Desktop) */
    .side-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--line);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      z-index: 50;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }
    .side-arrow:hover {
      background: var(--brand);
      border-color: var(--brand);
      transform: translateY(-50%) scale(1.1);
    }
    .arrow-left { left: 25px; }
    .arrow-right { right: 25px; }

    /* Swipe Instruction Pill */
    .swipe-instruction {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.7);
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Swipe Animations */
    .anim-slide-left {
      animation: slideLeftAnim 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    .anim-slide-right {
      animation: slideRightAnim 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    @keyframes slideLeftAnim {
      0% { opacity: 0; transform: translateX(60px) scale(0.96); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slideRightAnim {
      0% { opacity: 0; transform: translateX(-60px) scale(0.96); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* Empty state */
    .empty-state-box {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }
    .empty-state-box h3 {
      font-size: 20px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .deck-container { padding: 8px 4px; }
      .side-arrow { display: none; }
      .headline-text { font-size: 17px; }
      .summary-60words { font-size: 13.5px; }
      .short-card-wrapper { max-height: calc(100vh - 100px); }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="shorts-header">
    <a href="index.html" class="logo-box">
      <div class="logo-text">THE <span>90I</span></div>
      <span class="shorts-badge">⚡ SHORTS</span>
    </a>
    <div class="nav-actions">
      <a href="index.html">🏠 होम पोर्टल</a>
    </div>
  </header>

  <!-- Progress Bar Indicator -->
  <div class="progress-bar-container">
    <div id="progressBar" class="progress-bar-fill"></div>
  </div>

  <!-- Deck Feed -->
  <main class="deck-container" id="deckContainer">
    <div class="empty-state-box">
      <h3>समाचार लोड हो रहे हैं...</h3>
      <p>कृपया प्रतीक्षा करें...</p>
    </div>
  </main>

  <!-- Desktop Navigation Controls -->
  <button class="side-arrow arrow-left" onclick="showPrevShort()" title="पिछली खबर (Left Arrow)">❮</button>
  <button class="side-arrow arrow-right" onclick="showNextShort()" title="अगली खबर (Right Arrow)">❯</button>

  <div class="swipe-instruction">
    <span>👈</span> स्वाइप करें अगली खबर के लिए <span>👉</span>
  </div>

  <script>
    "use strict";

    let shortsList = [];
    let currentIndex = 0;
    let slideDirection = "left"; // 'left' = next, 'right' = prev

    document.addEventListener("DOMContentLoaded", initShortsApp);

    async function initShortsApp() {
      // 1. Check LocalStorage Cache
      try {
        const storageKeys = ["cached_db", "90i_news", "news_data", "news", "articles"];
        for (let k of storageKeys) {
          const cached = localStorage.getItem(k);
          if (cached) {
            const parsed = JSON.parse(cached);
            const list = extractNewsArray(parsed);
            if (list && list.length > 0) {
              shortsList = list;
              renderCurrentCard();
              break;
            }
          }
        }
      } catch(e) {}

      // 2. Fetch Fresh Data from server/JSON
      const paths = ["data/90i-data.json", "/data/90i-data.json", "90i-data.json", "data.json"];
      for (let p of paths) {
        try {
          const res = await fetch(p + "?_t=" + Date.now(), { cache: "no-store" });
          if (res.ok) {
            const db = await res.json();
            const list = extractNewsArray(db);
            if (list && list.length > 0) {
              shortsList = list;
              try { localStorage.setItem("cached_db", JSON.stringify(db)); } catch(e) {}
              renderCurrentCard();
              break;
            }
          }
        } catch(e) {}
      }

      if (!shortsList || !shortsList.length) {
        const container = document.getElementById("deckContainer");
        if (container) {
          container.innerHTML = `
            <div class="empty-state-box">
              <h3>कोई समाचार उपलब्ध नहीं है</h3>
              <p>कृपया मुख्य पोर्टल पर जाएं।</p>
            </div>
          `;
        }
      }
    }

    function extractNewsArray(db) {
      if (!db) return [];
      if (Array.isArray(db)) return db;
      if (Array.isArray(db["90i_news"])) return db["90i_news"];
      if (Array.isArray(db.news)) return db.news;
      if (Array.isArray(db.articles)) return db.articles;
      if (Array.isArray(db.data)) return db.data;
      return [];
    }

    function get60Words(item) {
      let text = item.excerpt || item.summary || item.content || item.body || "";
      text = text.replace(/<[^>]*>?/gm, '').trim();
      const words = text.split(/\s+/);
      if (words.length <= 60) return text;
      return words.slice(0, 60).join(" ") + "...";
    }

    function getRating(key) {
      const saved = localStorage.getItem("rating_data_" + key);
      if (saved) {
        try { return JSON.parse(saved).avg; } catch(e) {}
      }
      return "4.8";
    }

    function renderCurrentCard() {
      const container = document.getElementById("deckContainer");
      if (!container || !shortsList.length) return;

      const item = shortsList[currentIndex];
      const title = item.title || "शीर्षक उपलब्ध नहीं";
      const cat = item.category || "ताज़ा";
      const date = item.date || item.publishedAt || "आज";
      const author = item.author || "90I डिजिटल डेस्क";
      const img = item.image || "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800&q=80";
      const summary = get60Words(item);
      const rawId = item.id || item.slug || "short_" + currentIndex;
      const fullLink = item.slug ? `article.html?slug=${encodeURIComponent(item.slug)}` : `article.html?id=${encodeURIComponent(rawId)}`;
      const rating = getRating(rawId);

      // Update Top Progress Bar
      const progressBar = document.getElementById("progressBar");
      if (progressBar) {
        const progressPct = ((currentIndex + 1) / shortsList.length) * 100;
        progressBar.style.width = `${progressPct}%`;
      }

      const animClass = (slideDirection === "left") ? "anim-slide-left" : "anim-slide-right";

      container.innerHTML = `
        <div class="short-card-wrapper ${animClass}" id="activeCard">
          <div class="card-media-box">
            <img class="card-media-img" src="${img}" alt="${title}" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800&q=80'">
            <div class="card-media-overlay"></div>
            <span class="badge-category">${cat}</span>
            <span class="badge-rating">⭐ ${rating}</span>
          </div>

          <div class="card-body-box">
            <div>
              <h2 class="headline-text">${title}</h2>
              <div class="meta-row">
                <span>📅 ${date}</span>
                <span>•</span>
                <span>✍️ ${author}</span>
                <span>•</span>
                <span style="color:var(--brand); font-weight:800;">${currentIndex + 1}/${shortsList.length}</span>
              </div>
              <p class="summary-60words">${summary}</p>
            </div>

            <div class="card-footer-box">
              <a href="${fullLink}" class="btn-read-full">पूरी खबर पढ़ें ➔</a>
              <button class="btn-share" onclick="handleShare('${title}', '${fullLink}')">📢 शेयर</button>
            </div>
          </div>
        </div>
      `;
    }

    function showNextShort() {
      slideDirection = "left";
      if (currentIndex < shortsList.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0; // Loop to start
      }
      renderCurrentCard();
    }

    function showPrevShort() {
      slideDirection = "right";
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = shortsList.length - 1; // Loop to end
      }
      renderCurrentCard();
    }

    // Touch Swipe Handler (Right to Left -> Next | Left to Right -> Prev)
    let startX = 0;
    let startY = 0;

    document.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const deltaX = startX - endX;
      const deltaY = startY - endY;

      // Check if horizontal swipe is dominant
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
        if (deltaX > 0) {
          showNextShort(); // Right se Left -> Next News
        } else {
          showPrevShort(); // Left se Right -> Previous News
        }
      }
    }, { passive: true });

    // Keyboard Arrow Support
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") showNextShort();
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") showPrevShort();
    });

    function handleShare(title, link) {
      const fullUrl = window.location.origin + "/" + link;
      if (navigator.share) {
        navigator.share({ title: title, text: title, url: fullUrl }).catch(() => {});
      } else {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(title + " " + fullUrl)}`, "_blank");
      }
    }
  </script>
</body>
</html>
