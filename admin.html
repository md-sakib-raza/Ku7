<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>90i Admin CMS</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #ef4444;
      --ok: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #374151;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(140deg, #020617, #111827 50%, #1f2937);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      width: min(1200px, 95%);
      margin: 24px auto;
    }
    .card {
      background: rgba(17, 24, 39, .92);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,.28);
    }
    h1, h2, h3 { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 0.95rem; }
    .hidden { display: none !important; }

    /* Login */
    #loginScreen {
      width: min(420px, 95%);
      margin: 7vh auto;
      padding: 22px;
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #d1d5db;
      font-size: .93rem;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="url"], textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }
    textarea { resize: vertical; min-height: 100px; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: #dc2626;
    }
    button.secondary { background: #374151; }
    button.success { background: #059669; }
    button.warn { background: #d97706; }
    button:disabled { opacity: .65; cursor: not-allowed; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

    .admin-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
    }
    .sidebar .btn-group button {
      display: block; width: 100%; margin-bottom: 8px;
      background: #1f2937; border: 1px solid var(--border);
      text-align: left;
    }
    .sidebar .btn-group button.active {
      border-color: #ef4444;
      background: #3b0a0a;
    }

    .toolbar {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .toolbar button {
      background: #1f2937;
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: .9rem;
    }
    .editor {
      min-height: 240px;
      border: 1px solid var(--border);
      background: #0b1220;
      border-radius: 10px;
      padding: 12px;
      outline: none;
      line-height: 1.65;
    }

    .img-preview {
      margin-top: 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .img-preview img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: .94rem;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 8px;
      vertical-align: top;
      text-align: left;
    }
    th { color: #d1d5db; background: #1f2937; }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: .78rem;
      background: #2a2f3b;
      border: 1px solid #4b5563;
    }

    .status {
      margin-top: 10px;
      font-size: .92rem;
      min-height: 20px;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .status.warn { color: var(--warn); }

    @media (max-width: 960px) {
      .admin-layout { grid-template-columns: 1fr; }
      .row, .row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- LOGIN (NO FORM TAG) -->
  <section id="loginScreen" class="card">
    <h2>90i Admin Login</h2>
    <p class="muted">Use authorized credentials to continue.</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" placeholder="Email address" autocomplete="username" />
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
    </div>
    <button onclick="executeLogin()">Login</button>
    <div id="loginStatus" class="status"></div>
  </section>

  <!-- APP -->
  <section id="adminApp" class="container hidden">
    <div class="admin-layout">
      <aside class="sidebar card">
        <h3 id="brandName">90i CMS</h3>
        <p class="muted" id="brandTagline">Content control panel</p>

        <div class="btn-group">
          <button class="active" data-tab="composeTab" onclick="openTab('composeTab', this)">Compose Article</button>
          <button data-tab="newsTab" onclick="openTab('newsTab', this)">News Table</button>
          <button data-tab="inboxTab" onclick="openTab('inboxTab', this)">Inbox</button>
          <button onclick="logout()">Logout</button>
        </div>

        <hr style="border-color:#374151; margin:14px 0;">
        <h4 style="margin-top:0;">GitHub Sync Config</h4>
        <div class="field">
          <label for="ghOwner">Owner</label>
          <input id="ghOwner" type="text" value="md-sakib-raza" />
        </div>
        <div class="field">
          <label for="ghRepo">Repo</label>
          <input id="ghRepo" type="text" value="Ku7" />
        </div>
        <div class="field">
          <label for="ghToken">GitHub Token (repo scope)</label>
          <input id="ghToken" type="password" placeholder="ghp_xxx..." />
        </div>
      </aside>

      <main class="card">
        <!-- Compose -->
        <section id="composeTab" class="tabView">
          <h2>Create / Update Article</h2>
          <div class="row">
            <div class="field">
              <label for="newsTitle">Headline</label>
              <input id="newsTitle" type="text" placeholder="Type headline..." />
            </div>
            <div class="field">
              <label for="newsSlug">SEO Slug</label>
              <input id="newsSlug" type="text" placeholder="auto-generated-slug" />
            </div>
          </div>

          <div class="row-3">
            <div class="field">
              <label for="newsCategory">Category</label>
              <select id="newsCategory">
                <option value="National">National</option>
                <option value="International">International</option>
                <option value="Politics">Politics</option>
                <option value="Business">Business</option>
                <option value="Sports">Sports</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Technology">Technology</option>
                <option value="Lifestyle">Lifestyle</option>
              </select>
            </div>
            <div class="field">
              <label for="newsAuthor">Author</label>
              <input id="newsAuthor" type="text" value="Desk Reporter" />
            </div>
            <div class="field">
              <label for="newsPublished">Published Date</label>
              <input id="newsPublished" type="text" placeholder="YYYY-MM-DD" />
            </div>
          </div>

          <div class="field">
            <label for="newsSummary">Summary / Excerpt</label>
            <textarea id="newsSummary" placeholder="Short summary..."></textarea>
          </div>

          <div class="row">
            <div class="field">
              <label for="newsImageFile">Featured Image Upload</label>
              <input id="newsImageFile" type="file" accept="image/*" />
              <div id="imagePreview" class="img-preview">No image selected</div>
            </div>
            <div class="field">
              <label for="newsImageCaption">Image Caption</label>
              <input id="newsImageCaption" type="text" placeholder="Image caption..." />
              <div class="field" style="margin-top:10px;">
                <label for="newsImageUrl">Or Image URL</label>
                <input id="newsImageUrl" type="url" placeholder="https://..." />
              </div>
            </div>
          </div>

          <div class="field">
            <label>Body Content</label>
            <div class="toolbar">
              <button type="button" onclick="formatDoc('bold')"><b>B</b></button>
              <button type="button" onclick="formatDoc('italic')"><i>I</i></button>
              <button type="button" onclick="formatDoc('underline')"><u>U</u></button>
            </div>
            <div id="newsBodyEditor" class="editor" contenteditable="true"></div>
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="success" onclick="saveArticleToJsonAndGitHub()">Save + Sync</button>
            <button class="secondary" onclick="resetCompose()">Reset</button>
          </div>
          <div id="composeStatus" class="status"></div>
        </section>

        <!-- News table -->
        <section id="newsTab" class="tabView hidden">
          <h2>News Table</h2>
          <div id="newsTableWrap"></div>
        </section>

        <!-- Inbox -->
        <section id="inboxTab" class="tabView hidden">
          <h2>Inbox</h2>
          <div id="inboxWrap" class="muted">No messages.</div>
        </section>
      </main>
    </div>
  </section>

  <script>
    "use strict";

    const AUTH_KEY = "90i_auth_session";
    const DATA_PATH = "data/90i-data.json";
    const LOGIN_EMAIL = "mdsakibraza.066@gmail.com";
    const LOGIN_PASSWORD = "changeme1238";

    let appData = {
      branding: { name: "90i CMS", tagline: "Content control panel" },
      news: [],
      inbox: []
    };

    let selectedImageBase64 = "";

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      safeSetToday();
      bindLiveSlugGeneration();
      bindImagePreviewHandlers();
      const isLoggedIn = getSessionState();

      await loadDataDefensively();

      if (isLoggedIn) {
        showApp();
      } else {
        showLogin();
      }

      // Defensive startup calls (no TypeError even if JSON shape unexpected)
      loadBrandingUI();
      loadNewsTable();
      loadInbox();
    }

    function safeSetToday() {
      const d = new Date();
      const formatted = d.toISOString().slice(0, 10);
      const el = document.getElementById("newsPublished");
      if (el) el.value = formatted;
    }

    function showLogin() {
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("adminApp").classList.add("hidden");
    }

    function showApp() {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("adminApp").classList.remove("hidden");
    }

    function setStatus(id, message, type = "") {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = "status";
      if (type) el.classList.add(type);
      el.textContent = message;
    }

    function executeLogin() {
      const email = (document.getElementById("loginEmail")?.value || "").trim().toLowerCase();
      const password = (document.getElementById("loginPassword")?.value || "").trim();

      if (email === LOGIN_EMAIL && password === LOGIN_PASSWORD) {
        try {
          const payload = {
            ok: true,
            at: new Date().toISOString(),
            ua: navigator.userAgent || "unknown"
          };
          localStorage.setItem(AUTH_KEY, JSON.stringify(payload));
          setStatus("loginStatus", "Login successful.", "ok");
          showApp();
        } catch (err) {
          setStatus("loginStatus", "Storage error while saving session.", "err");
          return;
        }
      } else {
        setStatus("loginStatus", "Invalid email or password.", "err");
      }
    }

    function getSessionState() {
      try {
        const raw = localStorage.getItem(AUTH_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        return !!(parsed && parsed.ok);
      } catch (err) {
        return false;
      }
    }

    function logout() {
      try { localStorage.removeItem(AUTH_KEY); } catch (err) {}
      showLogin();
    }

    function openTab(tabId, btn) {
      document.querySelectorAll(".tabView").forEach(v => v.classList.add("hidden"));
      const t = document.getElementById(tabId);
      if (t) t.classList.remove("hidden");

      document.querySelectorAll(".sidebar .btn-group button[data-tab]").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }

    async function loadDataDefensively() {
      try {
        const res = await fetch(DATA_PATH, { cache: "no-store" });
        if (!res.ok) return;
        const json = await res.json();

        const safeBranding = (json && typeof json.branding === "object" && json.branding) ? json.branding : {};
        const safeNews = Array.isArray(json?.news) ? json.news : [];
        const safeInbox = Array.isArray(json?.inbox) ? json.inbox : [];

        appData = {
          branding: {
            name: typeof safeBranding.name === "string" ? safeBranding.name : "90i CMS",
            tagline: typeof safeBranding.tagline === "string" ? safeBranding.tagline : "Content control panel"
          },
          news: safeNews,
          inbox: safeInbox
        };
      } catch (err) {
        // Keep defaults silently (defensive)
      }
    }

    function loadBrandingUI() {
      const branding = (appData && typeof appData.branding === "object") ? appData.branding : {};
      const name = (typeof branding.name === "string" && branding.name.trim()) ? branding.name : "90i CMS";
      const tagline = (typeof branding.tagline === "string" && branding.tagline.trim()) ? branding.tagline : "Content control panel";

      const brandNameEl = document.getElementById("brandName");
      const brandTaglineEl = document.getElementById("brandTagline");
      if (brandNameEl) brandNameEl.textContent = name;
      if (brandTaglineEl) brandTaglineEl.textContent = tagline;
    }

    function loadNewsTable() {
      const wrap = document.getElementById("newsTableWrap");
      if (!wrap) return;

      const news = Array.isArray(appData?.news) ? appData.news : [];
      if (!news.length) {
        wrap.innerHTML = '<p class="muted">No articles found.</p>';
        return;
      }

      const rows = news.map(item => {
        const id = sanitize(item?.id ?? "");
        const title = sanitize(item?.title ?? "");
        const slug = sanitize(item?.slug ?? "");
        const category = sanitize(item?.category ?? "General");
        const status = sanitize(item?.status ?? "draft");
        const date = sanitize(item?.publishedAt ?? "");
        return `
          <tr>
            <td>${id}</td>
            <td>${title}</td>
            <td>${slug}</td>
            <td><span class="pill">${category}</span></td>
            <td>${date}</td>
            <td>${status}</td>
          </tr>
        `;
      }).join("");

      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Title</th><th>Slug</th><th>Category</th><th>Date</th><th>Status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function loadInbox() {
      const wrap = document.getElementById("inboxWrap");
      if (!wrap) return;

      const inbox = Array.isArray(appData?.inbox) ? appData.inbox : [];
      if (!inbox.length) {
        wrap.innerHTML = '<p class="muted">Inbox is empty.</p>';
        return;
      }

      wrap.innerHTML = inbox.map((m, i) => {
        const from = sanitize(m?.from ?? "Unknown");
        const subject = sanitize(m?.subject ?? "(No subject)");
        const msg = sanitize(m?.message ?? "");
        return `<div class="card" style="margin-bottom:8px;"><b>${i+1}. ${subject}</b><br><small>From: ${from}</small><p>${msg}</p></div>`;
      }).join("");
    }

    function formatDoc(cmd) {
      document.execCommand(cmd, false, null);
      document.getElementById("newsBodyEditor")?.focus();
    }

    function bindLiveSlugGeneration() {
      const titleEl = document.getElementById("newsTitle");
      const slugEl = document.getElementById("newsSlug");
      if (!titleEl || !slugEl) return;

      titleEl.addEventListener("input", () => {
        slugEl.value = slugify(titleEl.value || "");
      });
    }

    function bindImagePreviewHandlers() {
      const fileEl = document.getElementById("newsImageFile");
      const urlEl = document.getElementById("newsImageUrl");
      if (fileEl) {
        fileEl.addEventListener("change", async (e) => {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const base64 = await fileToDataURL(f);
          selectedImageBase64 = base64;
          renderImagePreview(base64);
        });
      }
      if (urlEl) {
        urlEl.addEventListener("change", () => {
          const u = (urlEl.value || "").trim();
          if (u) {
            selectedImageBase64 = "";
            renderImagePreview(u);
          }
        });
      }
    }

    function renderImagePreview(src) {
      const box = document.getElementById("imagePreview");
      if (!box) return;
      box.innerHTML = src ? `<img src="${sanitizeAttr(src)}" alt="Preview" />` : "No image selected";
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || ""));
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    function resetCompose() {
      ["newsTitle","newsSlug","newsAuthor","newsSummary","newsImageCaption","newsImageUrl"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
      const category = document.getElementById("newsCategory");
      if (category) category.value = "National";
      safeSetToday();
      const editor = document.getElementById("newsBodyEditor");
      if (editor) editor.innerHTML = "";
      selectedImageBase64 = "";
      renderImagePreview("");
      setStatus("composeStatus", "Editor reset.", "warn");
    }

    async function saveArticleToJsonAndGitHub() {
      try {
        setStatus("composeStatus", "Preparing article...", "warn");

        const title = (document.getElementById("newsTitle")?.value || "").trim();
        const slug = (document.getElementById("newsSlug")?.value || "").trim();
        const category = (document.getElementById("newsCategory")?.value || "General").trim();
        const author = (document.getElementById("newsAuthor")?.value || "Desk Reporter").trim();
        const publishedAt = (document.getElementById("newsPublished")?.value || "").trim();
        const summary = (document.getElementById("newsSummary")?.value || "").trim();
        const bodyHtml = (document.getElementById("newsBodyEditor")?.innerHTML || "").trim();
        const imageCaption = (document.getElementById("newsImageCaption")?.value || "").trim();
        const imageUrlInput = (document.getElementById("newsImageUrl")?.value || "").trim();

        if (!titl
