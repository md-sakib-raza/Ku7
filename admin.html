<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | THE 90I NEWS</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --border: #374151;
      --text: #f8fafc;
      --muted: #94a3b8;
      --brand: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 15px;
    }
    .panel-wrap { max-width: 1100px; margin: 0 auto; }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .panel-header h2 span { color: var(--brand); }
    .panel-header button {
      background: #7f1d1d;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .tab-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px;
      background: #020617;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--brand); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* SEO Special Box */
    .seo-box {
      background: #090e1a;
      border: 1px solid #1e3a8a;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .seo-box-title {
      font-size: 13px;
      font-weight: 800;
      color: #60a5fa;
      margin-bottom: 10px;
    }

    .editor-tools { display: flex; gap: 6px; margin-bottom: 6px; }
    .editor-tools button {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 800;
    }
    #newsBody {
      min-height: 200px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      outline: none;
      line-height: 1.6;
    }
    .img-preview { max-height: 150px; border-radius: 6px; margin-top: 8px; display: none; object-fit: cover; }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { background: #1e293b; }

    #toastBox {
      position: fixed;
      bottom: 25px;
      right: 25px;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: none;
      z-index: 99999;
      box-shadow: 0 5px 25px rgba(0,0,0,0.6);
    }
    .toast-success { background: #16a34a; border: 1px solid #22c55e; }
    .toast-error { background: #dc2626; border: 1px solid #ef4444; }

    @media (max-width: 700px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="toastBox"></div>

  <div class="panel-wrap">
    <div class="panel-header">
      <h2>THE <span>90I</span> NEWS — Control Panel</h2>
      <button type="button" onclick="logout()">🚪 Logout</button>
    </div>

    <div class="tab-bar">
      <button type="button" class="tab-btn active" id="btn_compose" onclick="switchSection('compose')">➕ Add Article</button>
      <button type="button" class="tab-btn" id="btn_list" onclick="switchSection('list')">📑 Manage News</button>
      <button type="button" class="tab-btn" id="btn_videos" onclick="switchSection('videos')">📹 Manage Videos</button>
      <button type="button" class="tab-btn" id="btn_token" onclick="switchSection('token')">☁️ GitHub Config</button>
      <a href="index.html" target="_blank" style="padding:10px 14px; background:#1e293b; color:#cbd5e1; text-decoration:none; border-radius:6px; font-weight:700; font-size:13px; border:1px solid var(--border);">🌐 Website</a>
    </div>

    <!-- COMPOSE TAB -->
    <div id="sec_compose" class="card">
      <h3 id="formTitle" style="margin-bottom: 15px;">नया समाचार प्रकाशित करें</h3>
      <input type="hidden" id="editId" value="" />
      
      <div class="form-group">
        <label>Title (शीर्षक) *</label>
        <input type="text" id="newsTitle" placeholder="हेडलाइन यहाँ लिखें..." oninput="generateSlug()" />
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label>Slug (English URL / Permalink) *</label>
          <input type="text" id="newsSlug" placeholder="news-slug" />
        </div>
        <div class="form-group">
          <label>Category (श्रेणी)</label>
          <select id="newsCategory">
            <option>बिहार</option>
            <option>राजनीति</option>
            <option>शिक्षा</option>
            <option>राष्ट्रीय</option>
            <option>झारखंड</option>
            <option>खेल</option>
            <option>व्यापार</option>
            <option>टेक्नोलॉजी</option>
            <option>मनोरंजन</option>
            <option>लाइफस्टाइल</option>
          </select>
        </div>
        <div class="form-group">
          <label>Reporter / Desk</label>
          <input type="text" id="newsAuthor" value="90I डिजिटल डेस्क" />
        </div>
      </div>

      <!-- SEO META DATA SECTION -->
      <div class="seo-box">
        <div class="seo-box-title">🔍 Google Search Ranking (SEO Meta Data)</div>
        <div class="grid-2">
          <div class="form-group">
            <label>Focus SEO Keywords (कॉमा लगाकर लिखें)</label>
            <input type="text" id="seoKeywords" placeholder="purnea university, bihar news, breaking news" />
          </div>
          <div class="form-group">
            <label>SEO Meta Title (Google Search Display)</label>
            <input type="text" id="seoMetaTitle" placeholder="Google में दिखने वाला सटीक टाइटल" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Short Summary (कार्ड्स और गूगल के लिए 1-2 लाइन का मुख्य सार) *</label>
        <textarea id="newsSummary" rows="2" placeholder="1-2 लाइन का संक्षिप्त सार यहाँ लिखें..."></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Photo (Auto Compressed)</label>
          <input type="file" id="newsFile" accept="image/*" onchange="handleImg(event)" />
          <input type="hidden" id="newsImgBase64" />
          <img id="imgPreview" class="img-preview" />
        </div>
        <div class="form-group">
          <label>Photo Caption & Alt Tag (Image SEO)</label>
          <input type="text" id="newsCaption" placeholder="फ़ोटो का विवरण (Google Image Rank)..." />
        </div>
      </div>

      <div class="form-group">
        <label>Article Content (पूरी खबर)</label>
        <div class="editor-tools">
          <button type="button" onclick="formatText('bold')"><b>B</b></button>
          <button type="button" onclick="formatText('italic')"><i>I</i></button>
          <button type="button" onclick="formatText('underline')"><u>U</u></button>
        </div>
        <div id="newsBody" contenteditable="true" placeholder="विस्तार से खबर लिखें..."></div>
      </div>

      <button type="button" class="btn" id="btnPublish" onclick="saveAndSync()">🚀 Cloud Publish (सेव करें)</button>
    </div>

    <!-- LIST TAB -->
    <div id="sec_list" class="card" style="display: none;">
      <h3>प्रकाशित समाचार सूची</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr><th>Title</th><th>Category</th><th>Date</th><th>Keywords</th><th>Action</th></tr>
          </thead>
          <tbody id="newsTable">
            <tr><td colspan="5" style="text-align:center;">लोड हो रहा है...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- VIDEOS TAB -->
    <div id="sec_videos" class="card" style="display: none;">
      <h3 style="margin-bottom: 15px;">होमपेज वीडियो बुलेटिन अपडेट करें</h3>
      <div class="form-group">
        <label>Video 1 - Title</label>
        <input type="text" id="vTitle1" placeholder="वीडियो 1 का शीर्षक" />
      </div>
      <div class="form-group">
        <label>Video 1 - YouTube Embed/Watch URL</label>
        <input type="url" id="vUrl1" placeholder="https://www.youtube.com/watch?v=..." />
      </div>
      <hr style="border-color: var(--border); margin: 15px 0;">
      <div class="form-group">
        <label>Video 2 - Title</label>
        <input type="text" id="vTitle2" placeholder="वीडियो 2 का शीर्षक" />
      </div>
      <div class="form-group">
        <label>Video 2 - YouTube Embed/Watch URL</label>
        <input type="url" id="vUrl2" placeholder="https://www.youtube.com/watch?v=..." />
      </div>
      <button type="button" class="btn" onclick="saveVideos()">💾 Save & Sync Videos</button>
    </div>

    <!-- TOKEN TAB -->
    <div id="sec_token" class="card" style="display: none;">
      <h3>GitHub Token Configuration</h3>
      <div class="form-group" style="max-width: 500px; margin-top: 15px;">
        <label>GitHub Personal Access Token (Classic - Repo Scope)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" />
      </div>
      <button type="button" class="btn" style="max-width: 200px;" onclick="saveToken()">💾 Save Token</button>
    </div>
  </div>

  <script>
    if (localStorage.getItem("90i_admin_logged") !== "true") {
      window.location.replace("login.html");
    }

    function logout() {
      localStorage.removeItem("90i_admin_logged");
      window.location.replace("login.html");
    }

    function showToast(msg, isError) {
      var t = document.getElementById("toastBox");
      t.innerText = msg;
      t.className = isError ? "toast-error" : "toast-success";
      t.style.display = "block";
      setTimeout(function(){ t.style.display = "none"; }, 3500);
    }

    window.onload = function() {
      document.getElementById('ghToken').value = localStorage.getItem('90i_gh_token') || '';
      loadNewsList();
      loadVideoInputs();
    };

    function switchSection(name) {
      document.getElementById('sec_compose').style.display = (name === 'compose') ? 'block' : 'none';
      document.getElementById('sec_list').style.display = (name === 'list') ? 'block' : 'none';
      document.getElementById('sec_videos').style.display = (name === 'videos') ? 'block' : 'none';
      document.getElementById('sec_token').style.display = (name === 'token') ? 'block' : 'none';

      document.getElementById('btn_compose').className = 'tab-btn' + (name === 'compose' ? ' active' : '');
      document.getElementById('btn_list').className = 'tab-btn' + (name === 'list' ? ' active' : '');
      document.getElementById('btn_videos').className = 'tab-btn' + (name === 'videos' ? ' active' : '');
      document.getElementById('btn_token').className = 'tab-btn' + (name === 'token' ? ' active' : '');

      if (name === 'list') loadNewsList();
      if (name === 'videos') loadVideoInputs();
    }

    function formatText(cmd) {
      document.execCommand(cmd, false, null);
      document.getElementById('newsBody').focus();
    }

    function generateSlug() {
      if (document.getElementById('editId').value) return;
      var t = document.getElementById('newsTitle').value.trim();
      var s = t.toLowerCase().replace(/[^a-zA-Z0-9 ]/g, '').trim().replace(/\s+/g, '-');
      document.getElementById('newsSlug').value = s ? s + '-' + Date.now().toString().slice(-4) : 'news-' + Date.now().toString().slice(-6);
      document.getElementById('seoMetaTitle').value = t ? (t + " | THE 90I NEWS") : '';
    }

    function handleImg(e) {
      var f = e.target.files[0];
      if (!f) return;

      var reader = new FileReader();
      reader.onload = function(evt) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement("canvas");
          var max_w = 600;
          var scale = max_w / img.width;
          canvas.width = (img.width > max_w) ? max_w : img.width;
          canvas.height = (img.width > max_w) ? (img.height * scale) : img.height;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var compressed = canvas.toDataURL("image/jpeg", 0.6);

          document.getElementById('newsImgBase64').value = compressed;
          var p = document.getElementById('imgPreview');
          p.src = compressed;
          p.style.display = 'block';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(f);
    }

    function saveToken() {
      var t = document.getElementById('ghToken').value.trim();
      if (!t) { showToast("⚠️ टोकन दर्ज करें!", true); return; }
      localStorage.setItem('90i_gh_token', t);
      showToast("✅ टोकन सुरक्षित हो गया!", false);
    }

    async function saveAndSync() {
      var title = document.getElementById('newsTitle').value.trim();
      if (!title) { showToast("⚠️ शीर्षक आवश्यक है!", true); return; }

      var token = (localStorage.getItem('90i_gh_token') || '').trim();
      if (!token) { 
        showToast("⚠️ पहले GitHub Config टैब में जाकर टोकन सेव करें!", true); 
        switchSection('token');
        return; 
      }

      var btn = document.getElementById('btnPublish');
      btn.innerText = "⏳ Saving to GitHub...";
      btn.disabled = true;

      try {
        var owner = "md-sakib-raza";
        var repo = "Ku7";
        var path = "data/90i-data.json";

        var getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path + '?_t=' + Date.now(), {
          headers: { 
            'Authorization': 'Bearer ' + token, 
            'Accept': 'application/vnd.github.v3+json' 
          }
        });

        if (getRes.status === 401 || getRes.status === 403) {
          throw new Error("GitHub Token Expired / Invalid (Repo Scope Required)!");
        }

        var sha = null;
        var db = { "90i_news": [], "news": [], "videos": [] };

        if (getRes.ok) {
          var ghData = await getRes.json();
          sha = ghData.sha;
          try {
            var decoded = decodeURIComponent(escape(window.atob(ghData.content.replace(/\s/g, ''))));
            db = JSON.parse(decoded);
          } catch(e) {}
        }

        var newsList = Array.isArray(db["90i_news"]) ? db["90i_news"] : (Array.isArray(db.news) ? db.news : []);

        var editId = document.getElementById('editId').value;
        var slug = document.getElementById('newsSlug').value || ('news-' + Date.now());
        var cat = document.getElementById('newsCategory').value;
        var author = document.getElementById('newsAuthor').value.trim() || '90I डिजिटल डेस्क';
        var summary = document.getElementById('newsSummary').value.trim();
        var keywords = document.getElementById('seoKeywords').value.trim();
        var metaTitle = document.getElementById('seoMetaTitle').value.trim() || title;
        var img = document.getElementById('newsImgBase64').value;
        var caption = document.getElementById('newsCaption').value.trim();
        var body = document.getElementById('newsBody').innerHTML;

        var item = {
          id: editId ? Number(editId) : Date.now(),
          title: title,
          slug: slug,
          category: cat,
          author: author,
          summary: summary,
          excerpt: summary,
          seo: {
            keywords: keywords,
            metaTitle: metaTitle
          },
          image: img,
          imageCaption: caption,
          imageAlt: caption || title,
          content: body,
          body: body,
          date: new Date().toISOString().split('T')[0],
          publishedAt: new Date().toISOString().split('T')[0]
        };

        if (editId) {
          var idx = newsList.findIndex(function(x) { return String(x.id) === String(editId); });
          if (idx !== -1) newsList[idx] = item;
        } else {
          newsList.unshift(item);
        }

        db["90i_news"] = newsList;
        db.news = newsList;

        var contentB64 = window.btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));

        var putRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
          method: 'PUT',
          headers: { 
            'Authorization': 'Bearer ' + token, 
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({ 
            message: "CMS News Update with SEO", 
            content: contentB64, 
            branch: "main", 
            sha: sha 
          })
        });

        if (!putRes.ok) {
          var errJson = await putRes.json().catch(function(){ return {}; });
          throw new Error(errJson.message || "HTTP Error " + putRes.status);
        }

        showToast("🎉 समाचार एवं SEO सफलतापूर्वक सेव हो गया!", false);
        resetForm();
        switchSection('list');
      } catch(err) {
        showToast("❌ " + err.message, true);
      } finally {
        btn.innerText = "🚀 Cloud Publish (सेव करें)";
        btn.disabled = false;
      }
    }

    async function loadNewsList() {
      var tb = document.getElementById('newsTable');
      try {
        var res = await fetch('data/90i-data.json?_t=' + Date.now());
        var db = res.ok ? await res.json() : {};
        var list = db["90i_news"] || db.news || [];
        if (!list.length) { tb.innerHTML = '<tr><td colspan="5" style="text-align:center;">कोई समाचार नहीं है।</td></tr>'; return; }

        tb.innerHTML = list.map(function(n) {
          var kw = (n.seo && n.seo.keywords) ? n.seo.keywords : '-';
          return '<tr>' +
            '<td><b>' + (n.title || '') + '</b></td>' +
            '<td>' + (n.category || '') + '</td>' +
            '<td>' + (n.date || n.publishedAt || '') + '</td>' +
            '<td><span style="font-size:11px; color:#60a5fa;">' + kw + '</span></td>' +
            '<td><button type="button" style="background:#2563eb; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="editNews(' + n.id + ')">✏️</button></td>' +
          '</tr>';
        }).join('');
      } catch(e) {
        tb.innerHTML = '<tr><td colspan="5" style="text-align:center;">डेटा लोड नहीं हुआ।</td></tr>';
      }
    }

    async function editNews(id) {
      var res = await fetch('data/90i-data.json?_t=' + Date.now());
      var db = res.ok ? await res.json() : {};
      var list = db["90i_news"] || db.news || [];
      var n = list.find(function(x) { return String(x.id) === String(id); });
      if (!n) return;

      document.getElementById('editId').value = n.id;
      document.getElement
