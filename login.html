<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | THE 90I NEWS</title>
    <!-- Google Fonts for Stylish Cursive & Hindi Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; } 
        body { 
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 15px; 
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 50%, #cbd5e1 100%);
        } 

        /* Neumorphic 3D Embossed Card */
        .login-box { 
            width: 100%; 
            max-width: 410px; 
            background: #f1f5f9; 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            border-radius: 24px; 
            padding: 35px 25px; 
            box-shadow: 20px 20px 60px rgba(163, 177, 198, 0.6), 
                        -20px -20px 60px rgba(255, 255, 255, 0.8); 
            text-align: center; 
        } 

        /* Stylish Cursive Header Logo Style */
        .cursive-logo {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #dc2626;
            margin-bottom: 2px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
        }

        .login-box p { 
            color: #64748b; 
            font-size: 13px; 
            margin-bottom: 22px; 
            font-weight: 500;
            letter-spacing: 0.3px;
        } 

        .form-group { 
            margin-bottom: 18px; 
            text-align: left; 
        } 

        .form-group label { 
            display: block; 
            font-size: 13px; 
            color: #334155; 
            margin-bottom: 6px; 
            font-weight: 600; 
        } 

        /* Embossed Recessed Input Boxes */
        .form-group input { 
            width: 100%; 
            padding: 14px 16px; 
            background: #f1f5f9; 
            border: none; 
            color: #0f172a; 
            border-radius: 12px; 
            outline: none; 
            font-size: 14px; 
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            box-shadow: inset 4px 4px 8px rgba(163, 177, 198, 0.5), 
                        inset -4px -4px 8px rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        } 

        .form-group input:focus { 
            box-shadow: inset 2px 2px 4px rgba(163, 177, 198, 0.6), 
                        inset -2px -2px 4px rgba(255, 255, 255, 0.9),
                        0 0 0 2px #dc2626;
        } 

        /* 3D Raised Convex Buttons */
        .btn { 
            width: 100%; 
            padding: 14px; 
            background: #dc2626; 
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 15px; 
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            margin-top: 8px; 
            box-shadow: 5px 5px 15px rgba(220, 38, 38, 0.3), 
                        -5px -5px 15px rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        } 

        .btn:hover { 
            background: #b91c1c; 
            transform: translateY(-1px);
        } 

        .btn:active {
            transform: translateY(1px);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }

        .btn-whatsapp { 
            background: #25d366; 
            margin-top: 10px; 
            display: inline-block; 
            text-decoration: none; 
            text-align: center; 
            box-shadow: 5px 5px 15px rgba(37, 211, 102, 0.3), 
                        -5px -5px 15px rgba(255, 255, 255, 0.5);
        } 

        .btn-whatsapp:hover { 
            background: #20ba5a; 
        } 

        .btn-secondary { 
            background: #cbd5e1; 
            color: #334155;
            margin-top: 10px; 
            box-shadow: 4px 4px 10px rgba(163, 177, 198, 0.4), 
                        -4px -4px 10px rgba(255, 255, 255, 0.8);
        } 

        .btn-secondary:hover { 
            background: #b9c7d8; 
        } 

        /* 6 Embossed Recessed Boxes for OTP */
        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 20px 0;
        }

        .otp-input {
            width: 46px;
            height: 52px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: #f1f5f9;
            border: none;
            border-radius: 12px;
            color: #0f172a;
            outline: none;
            box-shadow: inset 4px 4px 8px rgba(163, 177, 198, 0.6), 
                        inset -4px -4px 8px rgba(255, 255, 255, 0.9);
            transition: all 0.2s;
        }

        .otp-input:focus {
            box-shadow: inset 2px 2px 4px rgba(163, 177, 198, 0.6), 
                        inset -2px -2px 4px rgba(255, 255, 255, 0.9),
                        0 0 0 2px #dc2626;
        }

        .msg { 
            margin-top: 15px; 
            font-size: 13px; 
            color: #dc2626; 
            word-break: break-all; 
            font-weight: 600;
        } 

        .success-msg { 
            color: #16a34a; 
        } 

        .forgot-link { 
            display: block; 
            margin-top: 18px; 
            font-size: 13px; 
            color: #0284c7; 
            text-decoration: none; 
            cursor: pointer; 
            font-weight: 600;
        } 

        .forgot-link:hover { 
            text-decoration: underline; 
        }
        
        .auth-section { display: none; }
        .auth-section.active { display: block; }
    </style>
</head>
<body>

<div class="login-box">
    <!-- Stylish Cursive Logo Header -->
    <div class="cursive-logo">The 90i News</div>
    <p id="panelSubtitle">सुरक्षित एडमिन लॉगिन</p>

    <!-- 1. LOGIN FORM SECTION -->
    <div id="loginFormSection" class="auth-section active">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="txtEmail" placeholder="name@example.com" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="txtPass" placeholder="••••••••" />
        </div>
        <button type="button" class="btn" onclick="processLogin()">🔓 Login</button>
        <a class="forgot-link" onclick="showForgotModal()">पासवर्ड भूल गए? (Forgot Password)</a>
    </div>

    <!-- 2. FORGOT / EMAIL + USERNAME CODE SECTION -->
    <div id="forgotFormSection" class="auth-section">
        <div class="form-group">
            <label>अपनी एडमिन ईमेल दर्ज करें</label>
            <input type="email" id="txtResetEmail" placeholder="name@example.com" />
        </div>
        <div class="form-group">
            <label>एडमिन गुप्त कोड दर्ज करें</label>
            <input type="password" id="txtAdminCode" placeholder="गुप्त कोड (486119)..." />
        </div>
        <button type="button" class="btn" onclick="verifyEmailAndCode()">🔐 सत्यापित करें & WhatsApp पर भेजें</button>
        <button type="button" class="btn btn-secondary" onclick="hideForgotModal()">⬅️ वापस लॉगिन पर जाएं</button>
    </div>

    <!-- 3. WHATSAPP LINK SECTION -->
    <div id="waLinkSection" class="auth-section">
        <p style="font-size: 13px; color: #16a34a; margin-bottom: 15px; font-weight: 600;">डेटा सत्यापित हो गया है! नीचे दिए गए बटन पर क्लिक करके व्हाट्सएप पर OTP प्राप्त करें:</p>
        <a id="whatsappBtnLink" href="#" target="_blank" class="btn btn-whatsapp" onclick="showOtpVerifySection()">💬 WhatsApp पर OTP देखें</a>
        <button type="button" class="btn btn-secondary" onclick="hideForgotModal()">रद्द करें</button>
    </div>

    <!-- 4. EMBOSSED 6-BOX OTP VERIFY SECTION -->
    <div id="otpVerifySection" class="auth-section">
        <p style="font-size: 13px; color: #475569; margin-bottom: 15px; font-weight: 600;">WhatsApp पर भेजा गया 6-अंकों का OTP नीचे दर्ज करें:</p>
        
        <div class="otp-inputs" id="otpInputs">
            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 1)" onkeydown="handleKeyDown(event, 1)" />
            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 2)" onkeydown="handleKeyDown(event, 2)" />
            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 3)" onkeydown="handleKeyDown(event, 3)" />
            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 4)" onkeydown="handleKeyDown(event, 4)" />
            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 5)" onkeydown="handleKeyDown(event, 5)" />
            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 6)" onkeydown="handleKeyDown(event, 6)" />
        </div>

        <button type="button" class="btn" onclick="verifyOtpCode()">✅ Verify OTP</button>
        <button type="button" class="btn btn-secondary" onclick="hideForgotModal()">रद्द करें</button>
    </div>

    <!-- 5. NEW PASSWORD SET SECTION -->
    <div id="newPassSection" class="auth-section">
        <div class="form-group" style="margin-top: 5px;">
            <label>नया पासवर्ड दर्ज करें</label>
            <input type="password" id="txtNewPass" placeholder="नया पासवर्ड (कम से कम 6 अक्षर)..." />
        </div>
        <button type="button" class="btn" onclick="saveNewPassword()">💾 पासवर्ड अपडेट करें</button>
        <button type="button" class="btn btn-secondary" onclick="hideForgotModal()">रद्द करें</button>
    </div>

    <div id="errMsg" class="msg"></div>
</div>

<script>
    const ADMIN_EMAIL = "mdsakibraza.066@gmail.com"; 
    const ADMIN_WHATSAPP_NUMBER = "919060900466"; 
    const ADMIN_SECRET_CODE = "486119"; 

    if (!localStorage.getItem("90i_admin_pass")) { 
        localStorage.setItem("90i_admin_pass", "changeme1238"); 
    } 

    function processLogin() { 
        var e = (document.getElementById('txtEmail').value || '').trim().toLowerCase(); 
        var p = (document.getElementById('txtPass').value || '').trim(); 
        var msg = document.getElementById('errMsg'); 
        var savedPass = localStorage.getItem("90i_admin_pass"); 

        if (e === ADMIN_EMAIL && p === savedPass) { 
            localStorage.setItem("90i_admin_logged", "true"); 
            window.location.replace("admin.html"); 
        } else { 
            msg.className = "msg"; 
            msg.innerText = "❌ गलत ईमेल या पासवर्ड!"; 
        } 
    } 

    function showForgotModal() { 
        document.getElementById('loginFormSection').classList.remove('active'); 
        document.getElementById('forgotFormSection').classList.add('active'); 
        document.getElementById('waLinkSection').classList.remove('active');
        document.getElementById('otpVerifySection').classList.remove('active');
        document.getElementById('newPassSection').classList.remove('active');
        document.getElementById('panelSubtitle').innerText = "सुरक्षित पासवर्ड रीसेट"; 
        document.getElementById('errMsg').innerText = ""; 
        document.getElementById('txtResetEmail').value = ""; 
        document.getElementById('txtAdminCode').value = ""; 
    } 

    function hideForgotModal() { 
        document.getElementById('loginFormSection').classList.add('active'); 
        document.getElementById('forgotFormSection').classList.remove('active'); 
        document.getElementById('waLinkSection').classList.remove('active');
        document.getElementById('otpVerifySection').classList.remove('active');
        document.getElementById('newPassSection').classList.remove('active'); 
        document.getElementById('panelSubtitle').innerText = "सुरक्षित एडमिन लॉगिन"; 
        document.getElementById('errMsg').innerText = ""; 
    } 

    let generatedOtp = ""; 

    function verifyEmailAndCode() { 
        var email = (document.getElementById('txtResetEmail').value || '').trim().toLowerCase(); 
        var code = document.getElementById('txtAdminCode').value.trim(); 
        var msg = document.getElementById('errMsg'); 

        if (email !== ADMIN_EMAIL || code !== ADMIN_SECRET_CODE) { 
            msg.className = "msg"; 
            msg.innerText = "❌ गलत ईमेल या एडमिन गुप्त कोड!"; 
            return; 
        } 

        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString(); 

        var waMessage = encodeURIComponent("Hello Admin, The 90i News ke admin panel password reset ka OTP yeh hai: " + generatedOtp);
        var waUrl = "https://wa.me/" + ADMIN_WHATSAPP_NUMBER + "?text=" + waMessage;

        document.getElementById('whatsappBtnLink').href = waUrl;

        document.getElementById('forgotFormSection').classList.remove('active'); 
        document.getElementById('waLinkSection').classList.add('active'); 
        msg.className = "msg success-msg"; 
        msg.innerText = "✅ डेटा सही है! अब WhatsApp बटन पर क्लिक करें।"; 
    } 

    function showOtpVerifySection() {
        document.getElementById('waLinkSection').classList.remove('active');
        document.getElementById('otpVerifySection').classList.add('active');
        document.getElementById('panelSubtitle').innerText = "Verify Your OTP";
        document.getElementById('errMsg').innerText = "";
    }

    function moveToNext(current, boxIndex) {
        if (current.value.length === 1 && boxIndex < 6) {
            const inputs = document.querySelectorAll('.otp-input');
            inputs[boxIndex].focus();
        }
    }

    function handleKeyDown(event, boxIndex) {
        if (event.key === 'Backspace' && boxIndex > 1) {
            const inputs = document.querySelectorAll('.otp-input');
            if (inputs[boxIndex - 1].value === '') {
                inputs[boxIndex - 2].focus();
            }
        }
    }

    function verifyOtpCode() {
        const inputs = document.querySelectorAll('.otp-input');
        let enteredOtp = "";
        inputs.forEach(input => {
            enteredOtp += input.value.trim();
        });

        var msg = document.getElementById('errMsg');

        if (enteredOtp !== generatedOtp || enteredOtp.length !== 6) {
            msg.className = "msg";
            msg.innerText = "❌ अमान्य (Invalid) OTP कोड!";
            return;
        }

        msg.className = "msg success-msg";
        msg.innerText = "🎉 Verification Successful! Your account is now secure.";

        setTimeout(function() {
            document.getElementById('otpVerifySection').classList.remove('active');
            document.getElementById('newPassSection').classList.add('active');
            document.getElementById('panelSubtitle').innerText = "नया पासवर्ड सेट करें";
            document.getElementById('errMsg').innerText = "";
        }, 1500);
    }

    function saveNewPassword() { 
        var newPass = document.getElementById('txtNewPass').value.trim(); 
        var msg = document.getElementById('errMsg'); 

        if (newPass.length < 6) { 
            msg.className = "msg"; 
            msg.innerText = "❌ पासवर्ड कम से कम 6 अक्षरों का होना चाहिए!"; 
            return; 
        } 

        localStorage.setItem("90i_admin_pass", newPass); 
        alert("🎉 आपका पासवर्ड सफलतापूर्वक बदल गया है! अब नए पासवर्ड से लॉगिन करें।"); 
        hideForgotModal(); 
        document.getElementById('txtPass').value = ""; 
    }
</script>

</body>
</html>
