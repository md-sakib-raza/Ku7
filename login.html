<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | THE 90I NEWS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .login-box h2 { color: #dc2626; margin-bottom: 6px; font-size: 24px; font-weight: 800; }
    .login-box p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    .form-group input {
      width: 100%;
      padding: 11px;
      background: #020617;
      border: 1px solid #374151;
      color: #fff;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }
    .form-group input:focus { border-color: #dc2626; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      margin-top: 5px;
    }
    .btn:hover { background: #b91c1c; }
    .msg { margin-top: 12px; font-size: 13px; color: #ef4444; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>THE 90I NEWS</h2>
    <p>सुरक्षित एडमिन लॉगिन</p>
    
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="txtEmail" placeholder="name@example.com" />
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="txtPass" placeholder="••••••••" />
    </div>
    
    <button type="button" class="btn" onclick="processLogin()">🔓 Login</button>
    <div id="errMsg" class="msg"></div>
  </div>

  <script>
    function processLogin() {
      var e = (document.getElementById('txtEmail').value || '').trim().toLowerCase();
      var p = (document.getElementById('txtPass').value || '').trim();
      var msg = document.getElementById('errMsg');

      if (e === "mdsakibraza.066@gmail.com" && p === "changeme1238") {
        localStorage.setItem("90i_admin_logged", "true");
        window.location.replace("admin.html");
      } else {
        msg.innerText = "❌ गलत ईमेल या पासवर्ड!";
      }
    }
  </script>
</body>
</html>
