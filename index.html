  <script>
    "use strict";

    let globalNewsList = [];
    let currentCategoryFilter = "";

    function parseDateToTimestamp(dateStr) {
      if (!dateStr) return 0;
      var s = String(dateStr).trim();
      var matchYMD = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (matchYMD) return new Date(parseInt(matchYMD[1]), parseInt(matchYMD[2]) - 1, parseInt(matchYMD[3])).getTime();
      var matchDMY = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if (matchDMY) return new Date(parseInt(matchDMY[3]), parseInt(matchDMY[2]) - 1, parseInt(matchDMY[1])).getTime();
      var parsed = Date.parse(s);
      return isNaN(parsed) ? 0 : parsed;
    }

    function esc(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function attr(str) {
      if (!str) return "";
      return String(str).replace(/"/g, "&quot;");
    }

    function getRatingData(articleKey) {
      const key = "rating_data_" + articleKey;
      let saved = localStorage.getItem(key);
      if (saved) {
        try { return JSON.parse(saved); } catch(e) {}
      }
      let hash = 0;
      const str = String(articleKey || "default");
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      const absHash = Math.abs(hash);
      const chosenVotes = 65 + (absHash % 190);
      const data = { total: chosenVotes };
      try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
      return data;
    }

    function getArticleViews(id) {
      if (!id) return 140;
      const key = "view_count_" + id;
      let count = localStorage.getItem(key);
      if (!count) {
        count = Math.floor(Math.random() * (240 - 110 + 1)) + 110;
      } else {
        count = parseInt(count, 10) + Math.floor(Math.random() * 3 + 1);
      }
      try { localStorage.setItem(key, count); } catch(e) {}
      return count;
    }

    function recordNewsClick(id) {
      if (!id) return;
      const key = "view_count_" + id;
      let count = parseInt(localStorage.getItem(key) || "120", 10);
      count += Math.floor(Math.random() * 3 + 2);
      try { localStorage.setItem(key, count); } catch(e) {}
    }

    function updateGrowingVisitorStats() {
      const totalKey = "site_total_visits_count";
      let totalVisits = localStorage.getItem(totalKey);
      if (!totalVisits) {
        totalVisits = 14280;
      } else {
        totalVisits = parseInt(totalVisits, 10) + Math.floor(Math.random() * 3 + 1);
      }
      try { localStorage.setItem(totalKey, totalVisits); } catch(e) {}
      
      const totalEl = document.getElementById("totalVisitsVal");
      if (totalEl) totalEl.textContent = Number(totalVisits).toLocaleString("en-IN");

      const onlineEl = document.getElementById("onlineReadersVal");
      if (onlineEl) {
        const liveNow = Math.floor(Math.random() * (62 - 32 + 1)) + 32;
        onlineEl.textContent = liveNow;
      }
    }

    function extractNewsArray(db) {
      if (!db) return [];
      if (Array.isArray(db)) return db;
      if (Array.isArray(db["90i_news"])) return db["90i_news"];
      if (Array.isArray(db.news)) return db.news;
      if (Array.isArray(db.articles)) return db.articles;
      if (Array.isArray(db.data)) return db.data;
      if (Array.isArray(db.archive_news)) return db.archive_news;
      return [];
    }

    document.addEventListener("DOMContentLoaded", function() {
      initPortal();
      
      const cookieConsent = localStorage.getItem("the90inews_cookie_accepted");
      if (!cookieConsent) {
        setTimeout(() => {
          const banner = document.getElementById("cookieConsentBanner");
          if (banner) banner.style.display = "block";
        }, 800);
      }
    });

    function acceptCookies() {
      localStorage.setItem("the90inews_cookie_accepted", "true");
      const banner = document.getElementById("cookieConsentBanner");
      if (banner) banner.style.display = "none";
    }

    function rejectCookies() {
      localStorage.setItem("the90inews_cookie_accepted", "false");
      const banner = document.getElementById("cookieConsentBanner");
      if (banner) banner.style.display = "none";
    }

    // ⭐ मुख्य और आर्काइव फाइल से डेटा लोड करके डुप्लीकेट हटाने वाला स्मार्ट फंक्शन
    async function initPortal() {
      renderDateHeaders();
      updateGrowingVisitorStats();

      const params = new URLSearchParams(window.location.search);
      currentCategoryFilter = (params.get("cat") || "").trim();

      highlightActiveNav(currentCategoryFilter);

      let mainNews = [];
      let archiveNews = [];
      let dbSettings = {};

      try {
        const res1 = await fetch("data/90i-data.json?_t=" + Date.now(), { cache: "no-store" });
        if (res1.ok) {
          const db1 = await res1.json();
          dbSettings = db1;
          mainNews = extractNewsArray(db1);
        }
      } catch(e) {}

      try {
        const res2 = await fetch("data/archive-2026.json?_t=" + Date.now(), { cache: "no-store" });
        if (res2.ok) {
          const db2 = await res2.json();
          archiveNews = extractNewsArray(db2);
          if (db2.archive_news && Array.isArray(db2.archive_news)) {
            archiveNews = db2.archive_news;
          }
        }
      } catch(e) {}

      // दोनों सूचियों को मिलाएं
      let combined = mainNews.concat(archiveNews);

      // ⭐ डुप्लीकेट खबरें हटाने के लिए फिल्टर (ID या Title के आधार पर यूनिक बनाएँ)
      let uniqueMap = new Map();
      combined.forEach(item => {
        let identifier = item.id || item.slug || (item.title ? item.title.trim() : Math.random());
        if (!uniqueMap.has(identifier)) {
          uniqueMap.set(identifier, item);
        }
      });

      let uniqueNewsList = Array.from(uniqueMap.values());

      if (uniqueNewsList.length > 0) {
        globalNewsList = uniqueNewsList.sort((a, b) => parseDateToTimestamp(b.date) - parseDateToTimestamp(a.date));
        renderPortalData(globalNewsList, currentCategoryFilter);
        checkCustomAd(dbSettings);
        checkDirectVideos(dbSettings);
      } else {
        try {
          const cached = localStorage.getItem("cached_db");
          if (cached) {
            const parsed = JSON.parse(cached);
            globalNewsList = extractNewsArray(parsed);
            renderPortalData(globalNewsList, currentCategoryFilter);
          }
        } catch(e) {}
      }
    }

    function checkCustomAd(db) {
      const adBlock = document.getElementById("homepageAdBlock");
      const adImg = document.getElementById("homepageAdImg");
      if (!adBlock || !adImg) return;

      const adSettings = db?.customAd || JSON.parse(localStorage.getItem("admin_custom_ad") || "null");
      if (adSettings && adSettings.image) {
        adImg.src = adSettings.image;
        adBlock.style.display = "block";
      } else {
        adBlock.style.display = "none";
      }
    }

    function checkDirectVideos(db) {
      const videoBlock = document.getElementById("homepageVideoBlock");
      const videoContainer = document.getElementById("homepageVideoContainer");
      if (!videoBlock || !videoContainer) return;

      const dVideos = db?.directVideos || JSON.parse(localStorage.getItem("admin_direct_videos") || "[]");
      if (dVideos.length > 0) {
        videoBlock.style.display = "block";
        videoContainer.innerHTML = dVideos.map(v => `
          <div class="home-direct-video-card">
            <video controls preload="metadata">
              <source src="${v.videoUrl}" type="video/mp4">
              आपका ब्राउज़र वीडियो टैग का समर्थन नहीं करता है।
            </video>
            <div class="home-vid-title">${esc(v.title)}</div>
          </div>
        `).join("");
      } else {
        videoBlock.style.display = "none";
      }
    }

    function highlightActiveNav(cat) {
      const navLinks = document.querySelectorAll(".nav-scroll a.nav-btn");
      navLinks.forEach(link => {
        const linkCat = link.getAttribute("data-cat") || "";
        if (cat) {
          if (linkCat.toLowerCase() === cat.toLowerCase()) {
            link.classList.add("active");
          } else {
            link.classList.remove("active");
          }
        } else {
          if (linkCat === "") link.classList.add("active");
          else link.classList.remove("active");
        }
      });
    }

    function renderPortalData(items, catFilter) {
      if (!items || !items.length) return;

      const tickerText = items.slice(0, 5).map(n => esc(n.title || "")).filter(Boolean).join(" &nbsp;•&nbsp; ");
      const tickerEl = document.getElementById("tickerText");
      if (tickerEl && tickerText) tickerEl.innerHTML = tickerText;

      renderSpeedNews(items);

      if (catFilter) {
        document.getElementById("heroSection").style.display = "none";
        document.getElementById("defaultHomeSections").style.display = "none";
        
        const catBanner = document.getElementById("categoryBanner");
        const catBannerTitle = document.getElementById("categoryBannerTitle");
        if (catBanner && catBannerTitle) {
          catBanner.style.display = "flex";
          catBannerTitle.textContent = "श्रेणी: " + catFilter;
        }

        const filteredBlock = document.getElementById("filteredCategoryBlock");
        const filteredTitle = document.getElementById("filteredCategoryTitle");
        const filteredCount = document.getElementById("filteredCategoryCount");
        const filteredGrid = document.getElementById("filteredCategoryGrid");

        if (filteredBlock && filteredGrid) {
          filteredBlock.style.display = "block";
          filteredTitle.textContent = catFilter + " विशेष";
          
          const filteredItems = items.filter(n => {
            const c = (n?.category || "").toLowerCase();
            const t = (n?.title || "").toLowerCase();
            const f = catFilter.toLowerCase();
            return c.includes(f) || t.includes(f);
          });

          filteredCount.textContent = `${filteredItems.length} खबरें उपलब्ध`;

          if (filteredItems.length) {
            filteredGrid.innerHTML = filteredItems.map(createNewsCard).join("");
          } else {
            filteredGrid.innerHTML = `
              <div style="grid-column: 1/-1; padding: 40px 20px; text-align: center; background: var(--card-bg); border: 1px solid var(--line); border-radius: 10px;">
                <h3 style="font-size: 18px; color: var(--text); margin-bottom: 8px;">इस श्रेणी में अभी कोई समाचार उपलब्ध नहीं है।</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px;">कृपया अन्य श्रेणियां देखें या मुख्य पृष्ठ पर जाएं।</p>
                <a href="index.html" class="btn-reset-filter">सभी समाचार देखें</a>
              </div>
            `;
          }
        }
      } else {
        document.getElementById("heroSection").style.display = "block";
        document.getElementById("defaultHomeSections").style.display = "block";
        document.getElementById("categoryBanner").style.display = "none";
        document.getElementById("filteredCategoryBlock").style.display = "none";

        renderHeroSection(items);
        renderAllPortalSections(items);
      }
    }

    function renderDateHeaders() {
      const topDate = document.getElementById("liveDateDisplay");
      const footerYear = document.getElementById("footerYear");
      const now = new Date();

      const days = ["रविवार", "सोमवार", "मंगलवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
      const months = ["जनवरी", "फ़रवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"];
      const formatted = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

      if (topDate) topDate.textContent = `दिनांक: ${formatted}`;
      if (footerYear) footerYear.textContent = now.getFullYear();
    }

    function renderHeroSection(items) {
      if (!items || !items.length) return;

      const lead = items[0];
      const rawId = lead?.id || lead?.slug || "lead";
      const leadLink = lead?.slug ? `article.html?slug=${encodeURIComponent(lead.slug)}` : `article.html?id=${encodeURIComponent(rawId)}`;
      const leadRating = getRatingData(rawId);

      const spotCat = document.getElementById("spotlightCat");
      if (spotCat) spotCat.innerText = lead?.category || "मुख्य सुर्खी";

      const spotImg = document.getElementById("spotlightImg");
      if (spotImg && lead?.image) spotImg.src = lead.image;

      const sLink = document.getElementById("spotlightLink");
      if (sLink) {
        sLink.innerText = lead?.title || "शीर्षक उपलब्ध नहीं";
        sLink.href = leadLink;
        sLink.onclick = () => recordNewsClick(rawId);
      }

      const spotRating = document.getElementById("spotlightRating");
      if (spotRating) spotRating.innerHTML = `⭐ ${leadRating.total}+ पाठकों द्वारा रेटेड`;

      const spotAuth = document.getElementById("spotlightAuthor");
      if (spotAuth) spotAuth.innerText = "90i डेस्क";

      const spotDate = document.getElementById("spotlightDate");
      if (spotDate) spotDate.innerText = `${lead?.date || "आज"}`;

      const spotViews = document.getElementById("spotlightViews");
      if (spotViews) spotViews.innerHTML = `👁️ ${getArticleViews(rawId)} Views`;

      const spotExcerpt = document.getElementById("spotlightExcerpt");
      if (spotExcerpt) {
        const rawContent = lead?.excerpt || lead?.summary || lead?.content || "";
        spotExcerpt.innerText = String(rawContent).replace(/<[^>]*>?/gm, '').substring(0, 130) + '...';
      }

      const readMoreLead = document.getElementById("spotlightReadMoreBtn");
      if (readMoreLead) {
        readMoreLead.href = leadLink;
        readMoreLead.onclick = () => recordNewsClick(rawId);
      }

      const subContainer = document.getElementById("heroSubleadsBox");
      if (subContainer) {
        const subItems = items.slice(1, 4);
        subContainer.innerHTML = subItems.map(item => {
          const sId = item?.id || item?.slug || "sub";
          const link = item?.slug ? `article.html?slug=${encodeURIComponent(item.slug)}` : `article.html?id=${encodeURIComponent(sId)}`;
          const rating = getRatingData(sId);
          return `
            <a href="${link}" class="sublead-card" onclick="recordNewsClick('${sId}')">
              <img class="sublead-thumb" src="${attr(item?.image || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=200&q=80')}" alt="${esc(item?.title)}" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=200&q=80'">
              <div class="sublead-content">
                <div class="sublead-cat-row">
                  <span class="sublead-cat">${esc(item?.category || "ताज़ा खबर")}</span>
                  <span class="rating-badge-card">⭐ ${rating.total}+ रेटिंग</span>
                </div>
                <div class="sublead-headline">${esc(item?.title)}</div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                  <span class="sublead-meta">${esc(item?.date || "आज")} • 👁️ ${getArticleViews(sId)} Views</span>
                  <span style="font-size: 12px; font-weight: 800; color: var(--brand);">और पढ़ें ➔</span>
                </div>
              </div>
            </a>
          `;
        }).join("");
      }
    }

    function createNewsCard(a) {
      const title = esc(a?.title || "शीर्षक उपलब्ध नहीं");
      const category = esc(a?.category || "ताज़ा खबर");
      const date = esc(a?.date || "आज");
      const rawSummary = a?.excerpt || a?.summary || (a?.content ? String(a.content).replace(/<[^>]*>?/gm, '').substring(0, 100) + '...' : '');
      const summary = esc(rawSummary);
      const image = String(a?.image || "").trim();
      const rawId = a?.id || a?.slug || "item";
      const slug = encodeURIComponent(String(a?.slug || rawId));
      const link = a?.slug ? `article.html?slug=${slug}` : `article.html?id=${encodeURIComponent(rawId)}`;
      const views = getArticleViews(rawId);
      const rating = getRatingData(rawId);

      return `
        <article class="news-card">
          <div class="card-thumb-wrap">
            <a href="${link}" onclick="recordNewsClick('${rawId}')">
              <img class="card-thumb" loading="lazy" src="${attr(image || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=400&q=80')}" alt="${title}" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=400&q=80'">
            </a>
          </div>
          <div class="card-body">
            <div class="card-header-row">
              <span class="cat-badge">${category}</span>
              <span class="rating-badge-card">⭐ ${rating.total}+ रेटिंग्स</span>
            </div>
            <h3 class="card-title"><a href="${link}" onclick="recordNewsClick('${rawId}')">${title}</a></h3>
            <p class="card-summary">${summary}</p>
            <a href="${link}" class="btn-read-more" onclick="recordNewsClick('${rawId}')">और पढ़ें ➔</a>
          </div>
          <div class="card-footer">
            <span>${date}</span>
            <span class="view-count-tag">👁️ ${views}</span>
          </div>
        </article>
      `;
    }

    function renderAllPortalSections(items) {
      const mainGrid = document.getElementById("epaperGrid");
      if (mainGrid) mainGrid.innerHTML = items.slice(0, 6).map(createNewsCard).join("");

      const biharGrid = document.getElementById("biharGrid");
      if (biharGrid) {
        const biharItems = items.filter(n => (n?.category || "").includes("बिहार") || (n?.title || "").includes("बिहार") || (n?.title || "").includes("पूर्णिया"));
        biharGrid.innerHTML = (biharItems.length ? biharItems.slice(0, 3) : items.slice(0, 3)).map(createNewsCard).join("");
      }

      const polList = document.getElementById("politicsList");
      if (polList) {
        const polItems = items.filter(n => (n?.category || "").includes("राजनीति") || (n?.category || "").includes("राष्ट्रीय"));
        const pSource = polItems.length ? polItems.slice(0, 4) : items.slice(0, 4);
        polList.innerHTML = pSource.map(item => {
          const rId = item?.id || item?.slug || "item";
          const rating = getRatingData(rId);
          return `
            <a href="${item?.slug ? `article.html?slug=${encodeURIComponent(item.slug)}` : `article.html?id=${encodeURIComponent(rId)}`}" class="speed-item" onclick="recordNewsClick('${rId}')">
              <div class="speed-headline">● ${esc(item?.title)}</div>
              <div class="speed-meta">
                <span>${esc(item?.date || "आज")} • ${esc(item?.category || "राजनीति")}</span>
                <span style="color:var(--brand); font-weight:800; font-size:11.5px;">और पढ़ें ➔</span>
              </div>
            </a>
          `;
        }).join("");
      }

      const bizList = document.getElementById("businessList");
      if (bizList) {
        const bizItems = items.filter(n => (n?.category || "").includes("व्यापार") || (n?.category || "").includes("टेक्नोलॉजी") || (n?.category || "").includes("शिक्षा"));
        const bSource = bizItems.length ? bizItems.slice(0, 4) : items.slice(0, 4);
        bizList.innerHTML = bSource.map(item => {
          const rId = item?.id || item?.slug || "item";
          const rating = getRatingData(rId);
          return `
            <a href="${item?.slug ? `article.html?slug=${encodeURIComponent(item.slug)}` : `article.html?id=${encodeURIComponent(rId)}`}" class="speed-item" onclick="recordNewsClick('${rId}')">
              <div class="speed-headline">● ${esc(item?.title)}</div>
              <div class="speed-meta">
                <span>${esc(item?.date || "आज")} • ${esc(item?.category || "व्यापार")}</span>
                <span style="color:var(--brand); font-weight:800; font-size:11.5px;">और पढ़ें ➔</span>
              </div>
            </a>
          `;
        }).join("");
      }

      const entGrid = document.getElementById("entGrid");
      if (entGrid) {
        const entItems = items.filter(n => (n?.category || "").includes("मनोरंजन") || (n?.category || "").includes("खेल") || (n?.category || "").includes("लाइफस्टाइल"));
        entGrid.innerHTML = (entItems.length ? entItems.slice(0, 3) : items.slice(0, 3)).map(createNewsCard).join("");
      }

      const countEl = document.getElementById("totalNewsCount");
      if (countEl) countEl.innerText = `कुल समाचार: ${items.length}`;
    }

    function renderSpeedNews(items) {
      const container = document.getElementById("speedNewsList");
      if (!container) return;
      container.innerHTML = items.slice(0, 6).map(item => {
        const rId = item?.id || item?.slug || 'item';
        const rating = getRatingData(rId);
        return `
          <a href="${item?.slug ? `article.html?slug=${encodeURIComponent(item.slug)}` : `article.html?id=${encodeURIComponent(rId)}`}" class="speed-item" onclick="recordNewsClick('${rId}')">
            <div class="speed-headline">${esc(item?.title)}</div>
            <div class="speed-meta">
              <span>${esc(item?.date || "आज")}</span>
              <span style="color:var(--brand); font-weight:800; font-size:11.5px;">और पढ़ें ➔</span>
            </div>
          </a>
        `;
      }).join("");
    }
    // (बाकी के सभी सर्च, चैटबॉट और पॉलिसी फंक्शन्स वैसे ही रहेंगे)
  </script>
