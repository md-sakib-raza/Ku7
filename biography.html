  <script>
    const SUPABASE_URL = "https://jaruakuujaekjcqagymo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l0X-6k1XsRBuJB0jqzue-w_qmdhqBaC";

    let cachedBioList = [];

    async function initBiographyPage() {
      const container = document.getElementById("dynamicBioContent");

      // Check if Supabase library loaded successfully
      if (typeof supabase === 'undefined') {
        container.innerHTML = `<p style="color:red; text-align:center; padding:20px;">⚠️ Supabase लाइब्रेरी लोड नहीं हो पाई है। कृपया अपना इंटरनेट कनेक्शन चेक करें या पेज रिफ्रेश करें।</p>`;
        return;
      }

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const params = new URLSearchParams(window.location.search);
      const slug = (params.get("slug") || "").trim().toLowerCase();

      try {
        const { data: bioList, error } = await supabaseClient
          .from('biographies')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        cachedBioList = bioList || [];

        if (!slug) {
          renderBioDirectory(cachedBioList);
          return;
        }

        const person = cachedBioList.find(b => String(b.slug || "").toLowerCase() === slug);
        if (!person) {
          container.innerHTML = `<h2>व्यक्ति विशेष की बायोग्राफी नहीं मिली।</h2><p><a href='biography.html'>सभी बायोग्राफी देखें</a></p>`;
          return;
        }

        document.title = person.name + " — बायोग्राफी | THE 90I NEWS";

        container.innerHTML = `
          <h1 class="bio-title">${person.name}</h1>
          <div class="bio-subtitle">${person.title_tag || "विशिष्ट व्यक्तित्व"}</div>

          <div class="wiki-infobox">
            <h3>${person.name}</h3>
            ${person.image ? `<img src="${person.image}" alt="${person.name}" />` : ''}
            <div class="wiki-row"><div class="wiki-label">पूरा नाम</div><div class="wiki-value">${person.name}</div></div>
            <div class="wiki-row"><div class="wiki-label">जन्म तिथि</div><div class="wiki-value">${person.birth_date || 'उपलब्ध नहीं'}</div></div>
            <div class="wiki-row"><div class="wiki-label">जन्म स्थान</div><div class="wiki-value">${person.birth_place || 'बिहार'}</div></div>
            <div class="wiki-row"><div class="wiki-label">क्षेत्र</div><div class="wiki-value">${person.field || 'विविध'}</div></div>
            <div class="wiki-row"><div class="wiki-label">वर्तमान पद</div><div class="wiki-value">${person.current_position || 'लागू नहीं'}</div></div>
          </div>

          <div class="bio-content">
            <p><b>परिचय:</b> ${person.intro || ''}</p>
            ${person.education ? `<h2>शिक्षा (Education)</h2><p>${person.education}</p>` : ''}
            ${person.political_career ? `<h2>राजनीतिक करियर (Political Career)</h2><p>${person.political_career}</p>` : ''}
            ${person.career_work ? `<h2>कार्य और उपलब्धियां (Career & Achievements)</h2><p>${person.career_work}</p>` : ''}
            ${person.content ? `<h2>जीवन परिचय (Biography)</h2>${person.content}` : ''}
          </div>

          <div class="share-container">
            <span class="share-title">शेयर करें:</span>
            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(person.name + ' - ' + window.location.href)}" target="_blank" class="share-btn btn-wa">💬 WhatsApp</a>
            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn btn-fb">📘 Facebook</a>
            <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(person.name)}&url=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn btn-tw">🐦 Twitter</a>
            <button onclick="navigator.clipboard.writeText(window.location.href); alert('✅ लिंक कॉपी हो गया है!');" class="share-btn btn-cp" style="border:none; cursor:pointer;">🔗 Copy Link</button>
          </div>

          <div style="margin-top: 40px; border-top: 2px solid var(--line); padding-top: 20px;">
            <h3 style="font-family:serif; margin-bottom:15px;">अन्य प्रमुख बायोग्राफी</h3>
            <div class="bio-grid" id="otherBioGrid">
              ${cachedBioList.filter(b => b.slug !== slug).map(b => `
                <a href="biography.html?slug=${b.slug}" class="bio-card">
                  <img src="${b.image \vert{}\vert{} 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&q=80'}" alt="${b.name}" />
                  <div>
                    <h4>${b.name}</h4>
                    <p>${b.title_tag || 'जीवनी'}</p>
                  </div>
                </a>
              `).join("")}
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<p style="color:red; text-align:center; padding:20px;">डेटा लोड करने में त्रुटि: ${err.message}</p>`;
      }
    }

    function renderBioDirectory(list) {
      const container = document.getElementById("dynamicBioContent");
      if (!list || !list.length) {
        container.innerHTML = "<h2 style='text-align:center; padding:20px;'>फिलहाल कोई बायोग्राफी उपलब्ध नहीं है।</h2>";
        return;
      }
      container.innerHTML = `
        <h2 style="font-family: serif; border-bottom: 2px solid var(--wiki-border); padding-bottom: 6px; margin-bottom: 15px;">प्रमुख हस्तियाँ व बायोग्राफी डायरेक्टरी</h2>
        <div class="bio-grid" id="bioGridContainer">
          ${list.map(b => `
            <a href="biography.html?slug=${b.slug}" class="bio-card">
              <img src="${b.image \vert{}\vert{} 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&q=80'}" alt="${b.name}" />
              <div>
                <h4>${b.name}</h4>
                <p>${b.title_tag || 'जीवनी'}</p>
              </div>
            </a>
          `).join("")}
        </div>
      `;
    }

    function filterBioList(query) {
      const q = query.toLowerCase().trim();
      const filtered = cachedBioList.filter(b => 
        (b.name && b.name.toLowerCase().includes(q)) || 
        (b.title_tag && b.title_tag.toLowerCase().includes(q)) ||
        (b.field && b.field.toLowerCase().includes(q))
      );
      
      const grid = document.getElementById("bioGridContainer");
      if (!grid) return;

      grid.innerHTML = filtered.map(b => `
        <a href="biography.html?slug=${b.slug}" class="bio-card">
          <img src="${b.image || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&q=80'}" alt="${b.name}" />
          <div>
            <h4>${b.name}</h4>
            <p>${b.title_tag || 'जीवनी'}</p>
          </div>
        </a>
      `).join("");
    }

    // Run when page loads
    window.addEventListener('DOMContentLoaded', initBiographyPage);
  </script>
