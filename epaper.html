          <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Paper | 90i</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --brand:#b91c1c;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Noto Sans Devanagari", "Noto Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      width:min(1200px, 95%);
      margin:24px auto 30px;
    }
    .head{
      background:linear-gradient(120deg,#7f1d1d,#b91c1c,#991b1b);
      color:#fff;
      border-radius:14px;
      padding:18px;
      margin-bottom:16px;
    }
    .head h1{ margin:0 0 6px; }
    .head p{ margin:0; opacity:.95; }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:14px;
    }
    .news-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 6px 16px rgba(0,0,0,.05);
      display:flex;
      flex-direction:column;
    }
    .thumb{
      width:100%;
      height:165px;
      object-fit:cover;
      background:#e5e7eb;
    }
    .content{
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      height:100%;
    }
    .badge{
      display:inline-block;
      align-self:flex-start;
      font-size:.75rem;
      background:#fee2e2;
      color:#991b1b;
      border:1px solid #fecaca;
      border-radius:999px;
      padding:3px 8px;
    }
    .title{
      margin:0;
      font-size:1.04rem;
      line-height:1.4;
    }
    .meta{
      color:var(--muted);
      font-size:.86rem;
    }
    .summary{
      margin:0;
      color:#374151;
      font-size:.92rem;
      line-height:1.55;
      flex-grow:1;
    }
    .read{
      text-decoration:none;
      background:var(--brand);
      color:#fff;
      display:inline-block;
      padding:8px 10px;
      border-radius:8px;
      font-size:.88rem;
      align-self:flex-start;
    }
    .empty{
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:18px;
      text-align:center;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>ई-पेपर संस्करण</h1>
      <p id="hindiDateLine">आज का डिजिटल संस्करण</p>
    </header>

    <section id="epaperGrid" class="grid"></section>
    <div id="emptyState" class="empty" style="display:none;">कोई प्रकाशित समाचार उपलब्ध नहीं है।</div>
  </main>

  <script>
    "use strict";

    const DATA_PATH = "data/90i-data.json";

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      setHindiDateHeader();
      try {
        const res = await fetch(DATA_PATH, { cache: "no-store" });
        if (!res.ok) throw new Error("Data fetch failed");
        const json = await res.json();

        const news = Array.isArray(json?.news) ? json.news : [];
        const published = news.filter(n => String(n?.status || "").toLowerCase() === "published");

        renderGrid(published);
      } catch (err) {
        renderGrid([]);
      }
    }

    function setHindiDateHeader() {
      const el = document.getElementById("hindiDateLine");
      if (!el) return;
      const now = new Date();
      const formatted = now.toLocaleDateString("hi-IN", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
      el.textContent = `दिनांक: ${formatted} • आज का संस्करण`;
    }

    function renderGrid(items) {
      const grid = document.getElementById("epaperGrid");
      const empty = document.getElementById("emptyState");
      if (!grid || !empty) return;

      if (!items.length) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      const html = items.map(a => {
        const title = esc(a?.title || "Untitled");
        const category = esc(a?.category || "General");
        const author = esc(a?.author || "Desk Reporter");
        const date = esc(a?.publishedAt || "");
        const summary = esc(a?.summary || "");
        const image = String(a?.image || "").trim();
        const slug = encodeURIComponent(String(a?.slug || ""));
        const id = encodeURIComponent(String(a?.id || ""));

        const link = a?.slug ? `article.html?slug=${slug}` : `article.html?id=${id}`;
        return `
          <article class="news-card">
            ${image ? `<img class="thumb" src="${attr(image)}" alt="${title}">` : `<div class="thumb"></div>`}
            <div class="content">
              <span class="badge">${category}</span>
              <h3 class="title">${title}</h3>
              <div class="meta">${author} • ${date}</div>
              <p class="summary">${summary}</p>
              <a class="read" href="${link}">पूरा पढ़ें</a>
            </div>
          </article>
        `;
      }).join("");

      grid.innerHTML = html;
    }

    function esc(v){
      return String(v).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }
    function attr(v){
      return String(v).replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
