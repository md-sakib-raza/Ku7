<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>श्रेणी — THE 90I NEWS</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="main-header">
    <div class="container site-branding">
      <h1 class="site-title"><a href="index.html">THE 90I NEWS</a></h1>
    </div>
  </header>

  <main class="container" style="margin-top: 30px; margin-bottom: 50px;">
    <h2 class="section-title" id="catTitle">श्रेणी समाचार</h2>
    <div class="grid-2col" id="catNewsGrid">
      <p>समाचार लोड हो रहे हैं...</p>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const data = await loadData();
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat') || 'बिहार';

      document.getElementById('catTitle').innerText = `${cat} — ताज़ा समाचार`;
      document.title = `${cat} — THE 90I NEWS`;

      const filtered = data?.news.filter(n => n.category.toLowerCase() === cat.toLowerCase()) || [];
      const grid = document.getElementById('catNewsGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<p>इस श्रेणी में अभी कोई समाचार उपलब्ध नहीं है।</p>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="news-card-sm">
          <img src="${item.image}" alt="${item.title}" style="height: 180px; width: 100%; object-fit: cover;">
          <div style="margin-top: 8px;">
            <span class="badge-category">${item.category}</span>
            <h3><a href="article.html?slug=${item.slug}">${item.title}</a></h3>
            <div class="news-meta" style="margin-top: 4px;">${formatDateHindi(item.date)} | ${item.author}</div>
            <p style="font-size: 14px; margin-top: 6px;">${item.excerpt}</p>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
